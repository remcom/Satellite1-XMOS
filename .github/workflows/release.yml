# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.
#
# Builds the Satellite1 XMOS firmware and, when a GitHub release is published,
# attaches the binaries to that release. The release tag (e.g. v1.2.0 or
# v1.2.0-beta.1) is baked into the firmware as its version, so the tag must
# follow the format described in docs/versioning.md.

name: Build and Release Firmware

on:
  release:
    types: [published]

  # Manual build without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (e.g. v1.2.0-dev.1). Leave empty for '<last tag>-dev'."
        type: string
        required: false
        default: ""
      package_revision:
        description: 'Debian packaging revision for the XMOS firmware package.'
        type: string
        required: false
        default: "1"

env:
  XCORE_BUILDER: "ghcr.io/xmos/xcore_builder:v3.1"
  FIRMWARE_ARTIFACT_NAME: "satellite_firmware_apps"
  DEBIAN_PACKAGE_ARTIFACT_NAME: "satellite1_firmware_deb"

permissions:
  contents: read

jobs:
  build_firmware:
    name: Build satellite xmos firmware
    runs-on: ubuntu-latest
    outputs:
      firmware_version: ${{ steps.version.outputs.firmware_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine firmware version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            last_tag=$(git describe --abbrev=0 --tags)
            version="${last_tag%%-*}-dev"
          fi
          if [[ ! "$version" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(-(alpha|beta|rc|dev)(\.[0-9]{1,3})?)?$ ]]; then
            echo "::error::'$version' is not a valid firmware version (expected vX.Y.Z[-alpha|beta|rc|dev[.N]], see docs/versioning.md)"
            exit 1
          fi
          echo "Firmware version: $version"
          echo "firmware_version=$version" >> "$GITHUB_OUTPUT"

      - name: Pull Docker builder
        run: |
          docker pull ${XCORE_BUILDER}

      - name: write firmware_version.txt
        run: |
          echo "${{ steps.version.outputs.firmware_version }}" > ${{ github.workspace }}/firmware_version.txt

      - name: Build
        run: |
          docker run --rm -u $(id -u):$(id -g) -w /ws -v ${{ github.workspace }}:/ws ${XCORE_BUILDER} bash -l tools/ci/build_firmware.sh tools/ci/firmwares.txt

      - name: Save metadata
        run: |
          bash tools/ci/log_metadata.sh ./dist/build_metadata.json

      # The Debian package carries the default firmware only; dist/ also holds
      # the experimental aec4 images, so stage the fixed_delay ones on their own.
      - name: Package Satellite1 XMOS firmware for Debian
        env:
          PACKAGE_REVISION: ${{ inputs.package_revision || '1' }}
        run: |
          deb_input=$(mktemp -d)
          cp ./dist/satellite1_firmware_fixed_delay.factory.bin \
             ./dist/satellite1_firmware_fixed_delay.upgrade.bin "$deb_input"/
          bash tools/ci/package_firmware_deb.sh --dist-dir "$deb_input" --output-dir ./dist

      - name: Save firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_ARTIFACT_NAME }}
          path: |
            ./dist/*.*
            !./dist/*.deb

      - name: Save Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEBIAN_PACKAGE_ARTIFACT_NAME }}
          path: ./dist/*.deb

  publish_release:
    name: Attach firmware to release
    if: ${{ github.event_name == 'release' }}
    needs: build_firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SOURCES_DIR: ${{ github.workspace }}/release/src
      RELEASE_ASSETS_DIR: ${{ github.workspace }}/release/assets

    steps:
      - name: Get Release Binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FIRMWARE_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_SOURCES_DIR }}

      - name: Get Debian package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEBIAN_PACKAGE_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_ASSETS_DIR }}

      # Each firmware image is attached twice: under its plain name (used by
      # existing ESPHome configs) and with "-<release tag>" appended, e.g.
      # satellite1_xmos-v1.2.0.factory.bin, so images of different releases
      # can sit side by side and be told apart by name. The zip is attached
      # with the versioned name only: the Documentation repo unzips "*.zip",
      # which breaks when a release has more than one zip.
      - name: Prepare release assets
        env:
          FIRMWARE_VERSION: ${{ needs.build_firmware.outputs.firmware_version }}
        run: |
          set -euo pipefail
          if [ "$FIRMWARE_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Built firmware version '$FIRMWARE_VERSION' does not match release tag '$RELEASE_TAG'"
            exit 1
          fi

          # add_asset <source file> <asset base name> <extension>
          add_asset() {
            cp "$1" "${RELEASE_ASSETS_DIR}/$2.$3"
            cp "$1" "${RELEASE_ASSETS_DIR}/$2-${FIRMWARE_VERSION}.$3"
          }

          cd "${RELEASE_SOURCES_DIR}"
          zip -r --symlinks "${RELEASE_ASSETS_DIR}/${FIRMWARE_ARTIFACT_NAME}-${FIRMWARE_VERSION}.zip" .
          add_asset satellite1_firmware_fixed_delay.factory.bin satellite1_xmos factory.bin
          add_asset satellite1_firmware_fixed_delay.factory.md5 satellite1_xmos factory.md5
          # Experimental: AEC on all four mics with a mono reference
          add_asset satellite1_firmware_aec4.factory.bin satellite1_xmos_aec4 factory.bin
          add_asset satellite1_firmware_aec4.factory.md5 satellite1_xmos_aec4 factory.md5
          ls -l "${RELEASE_ASSETS_DIR}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" ${RELEASE_ASSETS_DIR}/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update Documentation
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SECOND_REPO_PAT }}" \
            https://api.github.com/repos/FutureProofHomes/Documentation/actions/workflows/update-binaries-xmos.yaml/dispatches \
            -d '{"ref":"main", "inputs": {"xmos_release_tag": "${{ env.RELEASE_TAG }}"}}'
